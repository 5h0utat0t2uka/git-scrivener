packages:
  - "."

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true

verifyDepsBeforeRun: install

trustPolicy: no-downgrade
trustPolicyExclude:
  # Legacy v6 release without provenance:
  # https://github.com/npm/node-semver/issues/886
  - semver@6.3.1

minimumReleaseAge: 10080
# minimumReleaseAgeExclude:
#   - react
#   - react-dom
#   - "@types/react"
#   - "@types/react-dom"
