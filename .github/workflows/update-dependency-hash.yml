name: Update dependency hash

on:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - flake.lock
      - nix/package.nix

permissions:
  contents: read

concurrency:
  group: dependency-hash-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  calculate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Recalculate the dependency hash
        env:
          SCRIVENER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/update-pnpm-hash.mjs "$RUNNER_TEMP/hash.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-dependency-hash-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hash.json
          if-no-files-found: error
          retention-days: 3
